networks:
  crane-net: {}
  prometheus-net:
    external: true
services:
  node:
    environment:
      ANACHE: SE
    image: node
    labels:
    - a.label.name=themeti
    - traefik.http.routers.themeti.rule=Host(`themeti-node.docker.localhost`)
    networks: []
    ports: []
    volumes: []
  traefik-proxy:
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    - --entrypoints.web.address=:80
    - --providers.docker.constraints=Label(`a.label.name`, `themeti`)
    - --providers.docker.watch=true
    image: traefik:latest
    networks:
    - crane-net
    - prometheus-net
    ports:
    - 0:80
    - 0:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
