networks:
  crane-net: {}
  prometheus-net:
    external: true
services:
  service1:
    command: node index.js
    image: node
    labels:
    - a.label.name=miprimerservidorconcrane-1
    - traefik.http.routers.miprimerservidorconcrane-1-service1.rule=Host(`miprimerservidorconcrane-1-service1.docker.localhost`)
    networks:
    - crane-net
    ports:
    - '3000'
    restart: unless-stopped
    volumes:
    - /:/app
    - C:\Users\t-agu\OneDrive\Escritorio\tuki\crane-rest-api\api\files\temp\miprimerservidorconcrane-1\scripts\service1\index.js:/app/index.js
    - C:\Users\t-agu\OneDrive\Escritorio\tuki\crane-rest-api\api\files\temp\miprimerservidorconcrane-1\scripts\service1\package.json:/app/package.json
    working_dir: /app
  traefik-proxy:
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    - --entrypoints.web.address=:80
    - --providers.docker.constraints=Label(`a.label.name`, `miprimerservidorconcrane-1`)
    - --providers.docker.watch=true
    image: traefik:latest
    networks:
    - crane-net
    - prometheus-net
    ports:
    - 0:80
    - 0:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
