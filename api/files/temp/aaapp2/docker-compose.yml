networks:
  crane-net: {}
  prometheus-net:
    external: true
services:
  service1:
    image: erwqerw
    labels:
    - aaa
    - a.label.name=aaapp2
    - traefik.http.routers.aaapp2-service1.rule=Host(`aaapp2-service1.docker.localhost`)
    networks:
    - crane-net
    restart: unless-stopped
    volumes:
    - /:/var/lib/mysql
    - /:/usr/share/nginx/html
    working_dir: /app
  traefik-proxy:
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    - --entrypoints.web.address=:80
    - --providers.docker.constraints=Label(`a.label.name`, `aaapp2`)
    - --providers.docker.watch=true
    image: traefik:latest
    networks:
    - crane-net
    - prometheus-net
    ports:
    - 0:80
    - 0:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
