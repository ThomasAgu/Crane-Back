networks:
  crane-net: {}
  prometheus-net:
    external: true
services:
  ? ''
  : environment: {}
    image: ''
    labels:
    - a.label.name=holagaroto-10
    - traefik.http.routers.holagaroto-10.rule=Host(`holagaroto-10-.docker.localhost`)
    networks: []
    ports: []
    volumes: []
  traefik-proxy:
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    - --entrypoints.web.address=:80
    - --providers.docker.constraints=Label(`a.label.name`, `holagaroto-10`)
    - --providers.docker.watch=true
    image: traefik:latest
    networks:
    - crane-net
    - prometheus-net
    ports:
    - 0:80
    - 0:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
