networks:
  crane-net: {}
  prometheus-net:
    external: true
services:
  Service 1:
    command: null
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_PASSWORD: userpass
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: user
    image: mysql
    labels:
    - a.label.name=database-1
    - traefik.http.routers.database-1.rule=Host(`database-1-Service 1.docker.localhost`)
    networks: []
    ports:
    - '3306'
    resources:
      limits:
        cpus: null
        memory: null
    restart_policy: unless-stopped
    startup_scripts: []
    volumes:
    - path: /:/var/lib/mysql
      size: 20
  traefik-proxy:
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    - --entrypoints.web.address=:80
    - --providers.docker.constraints=Label(`a.label.name`, `database-1`)
    - --providers.docker.watch=true
    image: traefik:latest
    networks:
    - crane-net
    - prometheus-net
    ports:
    - 0:80
    - 0:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
