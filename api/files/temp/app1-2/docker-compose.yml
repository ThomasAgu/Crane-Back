networks:
  aaw3:
    driver: bridge
  crane-net: {}
  prometheus-net:
    external: true
services:
  aaaaa:
    environment:
      AAA: AAA
      MYSQL_DATABASE: mydb
      MYSQL_PASSWORD: userpass
    image: mysql
    labels:
    - Una label
    - dos label
    - trese label
    - a.label.name=app1-2
    - traefik.http.routers.app1-2-aaaaa.rule=Host(`app1-2-aaaaa.docker.localhost`)
    networks:
    - aaw3
    - crane-net
    ports:
    - '3306'
    restart: unless-stopped
    working_dir: /app
  traefik-proxy:
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    - --entrypoints.web.address=:80
    - --providers.docker.constraints=Label(`a.label.name`, `app1-2`)
    - --providers.docker.watch=true
    image: traefik:latest
    networks:
    - crane-net
    - prometheus-net
    ports:
    - 0:80
    - 0:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
