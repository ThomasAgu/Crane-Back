networks:
  crane-net: {}
  prometheus-net:
    external: true
  redecilla:
    driver: bridge
services:
  qq:
    command: npm run mati
    image: node
    labels:
    - qq
    - a.label.name=teste
    - traefik.http.routers.teste-qq.rule=Host(`teste-qq.docker.localhost`)
    networks:
    - redecilla
    - crane-net
    ports:
    - '323'
    restart: on-failure
    volumes:
    - C:\Users\t-agu\OneDrive\Escritorio\tuki\crane-rest-api\api\files\temp\teste\scripts\qq\server.js:/app/server.js
    working_dir: /app
  service1:
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_PASSWORD: userpass
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: user
    image: mysql
    labels:
    - a.label.name=teste
    - traefik.http.routers.teste-service1.rule=Host(`teste-service1.docker.localhost`)
    networks:
    - redecilla
    - crane-net
    ports:
    - '3306'
    restart: unless-stopped
    working_dir: /app
  traefik-proxy:
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    - --entrypoints.web.address=:80
    - --providers.docker.constraints=Label(`a.label.name`, `teste`)
    - --providers.docker.watch=true
    image: traefik:latest
    networks:
    - crane-net
    - prometheus-net
    ports:
    - 0:80
    - 0:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
