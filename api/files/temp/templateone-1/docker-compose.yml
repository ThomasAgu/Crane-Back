networks:
  crane-net: {}
  prometheus-net:
    external: true
services:
  service1:
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_PASSWORD: userpass
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: user
    image: mysql
    labels:
    - a.label.name=templateone-1
    - traefik.http.routers.templateone-1-service1.rule=Host(`templateone-1-service1.docker.localhost`)
    networks:
    - crane-net
    ports:
    - '3306'
    restart: unless-stopped
    volumes:
    - /:/var/lib/mysql
    working_dir: /app
  traefik-proxy:
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    - --entrypoints.web.address=:80
    - --providers.docker.constraints=Label(`a.label.name`, `templateone-1`)
    - --providers.docker.watch=true
    image: traefik:latest
    networks:
    - crane-net
    - prometheus-net
    ports:
    - 0:80
    - 0:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
