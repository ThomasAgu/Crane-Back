networks:
  crane-net: {}
  prometheus-net:
    external: true
services:
  mysql:
    image: mysql
    labels:
    - a.label.name=ANACHE-2
    - traefik.http.routers.ANACHE-2.rule=Host(`ANACHE-2-mysql.docker.localhost`)
    networks:
    - crane-net
    ports:
    - 0:3306
    volumes:
    - /:/var/lib/mysql
  traefik-proxy:
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    - --entrypoints.web.address=:80
    - --providers.docker.constraints=Label(`a.label.name`, `ANACHE-2`)
    - --providers.docker.watch=true
    image: traefik:latest
    networks:
    - crane-net
    - prometheus-net
    ports:
    - 0:80
    - 0:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
