groups:
- name: app-1-rules
  rules:
  - alert: high_request_count
    annotations:
      description: The request count for Traefik entrypoint is consistently high.
      summary: High request count for Traefik
    expr: increase(traefik_entrypoint_requests_total[10s]) > 100
    for: 10s
    labels:
      job: app-1
      severity: warning
  - alert: service_down
    annotations:
      description: The application is not responding. Stopping the application to
        prevent further issues.
      summary: Application is down
    expr: up == 0
    for: 1m
    labels:
      job: app-1
      severity: critical
